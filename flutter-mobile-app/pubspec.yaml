name: apk_store_app
description: "Official APKStore Mobile Client - Safe & Verified Android APK Installer"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  dio: ^5.4.3
  path_provider: ^2.1.2
  open_filex: ^4.5.0
  permission_handler: ^11.3.1
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.webp
