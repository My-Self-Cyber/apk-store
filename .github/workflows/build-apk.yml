name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Build Android Release APK
        working-directory: flutter-mobile-app
        run: |
          # 1. Create fresh official app template
          flutter create --org com.apkstore --project-name apk_store_app /tmp/fresh_app

          # 2. Backup our official cyber launcher icons
          mkdir -p /tmp/icons_backup
          cp -r android/app/src/main/res/mipmap-* /tmp/icons_backup/

          # 3. Replace android directory with fresh official scaffolding
          rm -rf android
          cp -r /tmp/fresh_app/android android
          chmod +x android/gradlew

          # 4. Restore our official cyber icons
          cp -r /tmp/icons_backup/mipmap-* android/app/src/main/res/

          # 5. Inject Internet permission & label using standard Python
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              c = f.read()
          if "android.permission.INTERNET" not in c:
              c = c.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application")
          c = c.replace("android:label=\"apk_store_app\"", "android:label=\"APKStore\"")
          with open(path, "w") as f:
              f.write(c)
          print("Manifest updated successfully!")
          '

          # 6. Fetch dependencies and compile release APK
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APKStore-Flutter-App
          path: flutter-mobile-app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "APKStore Mobile App v1.0.${{ github.run_number }}"
          body: "Official APKStore Android Native Application (.apk) with custom cyber logo and instant package installation."
          files: flutter-mobile-app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
