name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Initialize Android Scaffolding & Dependencies
        run: |
          cd flutter-mobile-app
          # Generate clean full android template
          flutter create temp_app --platforms=android --org com.apkstore
          cp -rn temp_app/android ./
          rm -rf temp_app
          
          # Inject permissions & configure minSdk=21, compileSdk=34
          python3 -c '
          import re

          manifest = "android/app/src/main/AndroidManifest.xml"
          with open(manifest, "r") as f:
              txt = f.read()
          perms = """
          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
          <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
          <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
          """
          if "android.permission.INTERNET" not in txt:
              txt = txt.replace("<application", perms + "\n    <application")
          with open(manifest, "w") as f:
              f.write(txt)

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              g = f.read()
          g = re.sub(r"minSdkVersion\s+.*", "minSdkVersion 21", g)
          g = re.sub(r"compileSdkVersion\s+.*", "compileSdkVersion 34", g)
          g = re.sub(r"targetSdkVersion\s+.*", "targetSdkVersion 34", g)
          with open(gradle_path, "w") as f:
              f.write(g)
          print("Gradle and Manifest configured!")
          '
          
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd flutter-mobile-app
          flutter build apk --release --no-tree-shake-icons > build.log 2>&1 || (tail -n 120 build.log; exit 1)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APKStore-Flutter-App
          path: flutter-mobile-app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "APKStore Mobile App v1.0.${{ github.run_number }}"
          body: "Official APKStore Android Native Application (.apk) with custom cyber logo and instant package installation."
          files: flutter-mobile-app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
