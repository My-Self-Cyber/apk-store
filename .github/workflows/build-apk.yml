name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Ensure Gradle Wrapper & Dependencies
        run: |
          # Generate official Flutter gradle wrapper binaries in a temp location
          flutter create --org com.apkstore --project-name fresh_app /tmp/fresh_app
          
          # Copy missing gradle wrapper files to our android folder
          cp -r /tmp/fresh_app/android/gradle flutter-mobile-app/android/
          cp /tmp/fresh_app/android/gradlew flutter-mobile-app/android/
          cp /tmp/fresh_app/android/gradlew.bat flutter-mobile-app/android/
          chmod +x flutter-mobile-app/android/gradlew
          
          # Fetch packages
          cd flutter-mobile-app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd flutter-mobile-app
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APKStore-Flutter-App
          path: flutter-mobile-app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "APKStore Mobile App v1.0.${{ github.run_number }}"
          body: "Official APKStore Android Native Application (.apk) with custom cyber logo and instant package installation."
          files: flutter-mobile-app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
