name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Build Official Android APK
        run: |
          set -e

          # 1. Create fresh official Flutter project
          flutter create --org com.apkstore --project-name apk_store_app /tmp/fresh_app

          # 2. Clean default templates
          rm -rf /tmp/fresh_app/lib
          rm -rf /tmp/fresh_app/test

          # 3. Copy our app files
          cp -r flutter-mobile-app/lib /tmp/fresh_app/
          cp -r flutter-mobile-app/assets /tmp/fresh_app/
          cp flutter-mobile-app/pubspec.yaml /tmp/fresh_app/
          cp -r flutter-mobile-app/android/app/src/main/res/mipmap-* /tmp/fresh_app/android/app/src/main/res/

          # 4. Configure AndroidManifest
          python3 -c '
          manifest = "/tmp/fresh_app/android/app/src/main/AndroidManifest.xml"
          with open(manifest, "r") as f:
              c = f.read()
          if "INTERNET" not in c:
              c = c.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application")
          c = c.replace("android:label=\"apk_store_app\"", "android:label=\"APKStore\"")
          with open(manifest, "w") as f:
              f.write(c)
          print("Updated AndroidManifest successfully!")
          '

          # 5. Build native APK
          cd /tmp/fresh_app
          flutter pub get
          flutter build apk --debug --verbose

          # 6. Copy final APK to workspace
          mkdir -p $GITHUB_WORKSPACE/final_apk
          find build -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/final_apk/APKStore.apk \;
          ls -lh $GITHUB_WORKSPACE/final_apk/APKStore.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APKStore-Flutter-App
          path: final_apk/APKStore.apk

      - name: Create GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "APKStore Mobile App v1.0.${{ github.run_number }}"
          body: "Official APKStore Android Native Application (.apk) with cyber logo and instant package installation."
          files: final_apk/APKStore.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
