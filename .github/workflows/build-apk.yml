name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Configure Flutter and Android Environment
        run: |
          FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
          echo "Flutter directory: $FLUTTER_DIR"
          echo "flutter.sdk=$FLUTTER_DIR" > flutter-mobile-app/android/local.properties
          chmod +x flutter-mobile-app/android/gradlew

      - name: Build Android APK
        working-directory: flutter-mobile-app
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Prepare APK Package
        run: |
          mkdir -p final_apk
          find flutter-mobile-app/build -name "*.apk" -exec cp {} final_apk/APKStore.apk \;
          ls -lh final_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APKStore-Flutter-App
          path: final_apk/APKStore.apk

      - name: Create GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "APKStore Mobile App v1.0.${{ github.run_number }}"
          body: "Official APKStore Android Native Application (.apk) with cyber logo and instant package installation."
          files: final_apk/APKStore.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
