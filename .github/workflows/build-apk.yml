name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Build Official Android APK
        run: |
          set +e

          # 1. Create fresh official Flutter project
          flutter create --org com.apkstore --project-name apk_store_app /tmp/fresh_app

          # 2. Clean default templates
          rm -rf /tmp/fresh_app/lib
          rm -rf /tmp/fresh_app/test
          rm -rf /tmp/fresh_app/android/app/src/main/res/mipmap-anydpi-v26

          # 3. Copy our app files
          cp -r flutter-mobile-app/lib /tmp/fresh_app/
          cp -r flutter-mobile-app/assets /tmp/fresh_app/
          cp flutter-mobile-app/pubspec.yaml /tmp/fresh_app/
          cp -r flutter-mobile-app/android/app/src/main/res/mipmap-* /tmp/fresh_app/android/app/src/main/res/

          # 4. Configure AndroidManifest and Kotlin version
          python3 -c '
          import os, re

          # 1. Update AndroidManifest
          manifest = "/tmp/fresh_app/android/app/src/main/AndroidManifest.xml"
          with open(manifest, "r") as f:
              c = f.read()
          if "INTERNET" not in c:
              c = c.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application")
          c = c.replace("android:label=\"apk_store_app\"", "android:label=\"APKStore\"")
          if "com.google.android.gms.ads.APPLICATION_ID" not in c:
              c = c.replace("</application>", "    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3839531386767343~2207859262\"/>\n    </application>")
          with open(manifest, "w") as f:
              f.write(c)
          print("Updated AndroidManifest with AdMob App ID successfully!")

          # 2. Update Kotlin Gradle plugin version to 1.9.24 across all android build configs
          def patch_kotlin(path):
              if not os.path.exists(path):
                  return
              with open(path, "r") as f:
                  txt = f.read()
              orig = txt
              txt = re.sub(r"id\s+[\x22\x27]org\.jetbrains\.kotlin\.android[\x22\x27]\s+version\s+[\x22\x27][^\x22\x27]+[\x22\x27]", "id \"org.jetbrains.kotlin.android\" version \"1.9.24\"", txt)
              txt = re.sub(r"id\s*\([\x22\x27]org\.jetbrains\.kotlin\.android[\x22\x27]\)\s*version\s*[\x22\x27][^\x22\x27]+[\x22\x27]", "id(\"org.jetbrains.kotlin.android\") version \"1.9.24\"", txt)
              txt = re.sub(r"ext\.kotlin_version\s*=\s*[\x22\x27][^\x22\x27]+[\x22\x27]", "ext.kotlin_version = \"1.9.24\"", txt)
              txt = re.sub(r"org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9\.]+", "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24", txt)
              if txt != orig:
                  with open(path, "w") as f:
                      f.write(txt)
                  print(f"Patched Kotlin 1.9.24 in: {path}")

          for root, _, files in os.walk("/tmp/fresh_app/android"):
              for file in files:
                  if file.endswith((".gradle", ".gradle.kts")):
                      patch_kotlin(os.path.join(root, file))
          '

          # 5. Build native APK
          cd /tmp/fresh_app
          flutter pub get
          flutter build apk --debug > /tmp/build.log 2>&1
          BUILD_STATUS=$?

          mkdir -p $GITHUB_WORKSPACE/final_apk
          find build -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/final_apk/APKStore.apk \;

          if [ ! -f $GITHUB_WORKSPACE/final_apk/APKStore.apk ]; then
            echo "Build failed with exit code $BUILD_STATUS"
            tail -n 120 /tmp/build.log > $GITHUB_WORKSPACE/BUILD_ERROR.txt
            cd $GITHUB_WORKSPACE
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add BUILD_ERROR.txt
            git commit -m "Capture build failure log" || true
            git push origin main || true
            exit 1
          fi

          echo "APK generated successfully!"
          ls -lh $GITHUB_WORKSPACE/final_apk/APKStore.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APKStore-Flutter-App
          path: final_apk/APKStore.apk

      - name: Create GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "APKStore Mobile App v1.0.${{ github.run_number }}"
          body: "Official APKStore Android Native Application (.apk) with cyber logo and instant package installation."
          files: final_apk/APKStore.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
